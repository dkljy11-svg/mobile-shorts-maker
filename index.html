<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1012">
<link rel="manifest" href="manifest.webmanifest">
<title>모바일 쇼츠 메이커 V5</title>
<style>
:root{--bg:#0f1012;--card:#191b1f;--line:#30343c;--text:#fff;--muted:#adb3bd;--green:#bdf5cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:20;padding:14px 16px;background:rgba(15,16,18,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0}h2{font-size:17px;margin:0 0 12px}
main{max-width:800px;margin:auto;padding:14px 12px 130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:760;margin:11px 0 7px}
input,textarea,select,button{width:100%;font:inherit}
input,textarea,select{background:#111318;color:#fff;border:1px solid #383c45;border-radius:12px;padding:12px}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:14px;padding:13px;font-weight:850;cursor:pointer}
.primary{background:#fff;color:#111}.secondary{background:#2a2d34;color:#fff}.good{background:#193125;color:var(--green)}.danger{background:#3a2328;color:#ffc1ca}.youtube{background:#ff0033;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}.pill{display:inline-block;border:1px solid #3a3f48;border-radius:999px;padding:5px 9px;font-size:12px;color:#d2d5dc;margin:0 5px 5px 0}
.templateGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.templateGrid button.active{outline:2px solid #fff}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.thumb{position:relative;border-radius:14px;overflow:hidden;background:#111;border:1px solid #2d3138;padding-bottom:8px}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover}.thumb textarea{min-height:64px;margin:6px;width:calc(100% - 12px);font-size:12px}.thumb .mini{display:grid;grid-template-columns:1fr 90px;gap:6px;padding:0 6px 6px}.thumb .tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:0 6px}
.thumb button{padding:8px 0;border-radius:8px;background:#25282e;color:#fff}
.preview{display:flex;justify-content:center}canvas{width:min(100%,350px);aspect-ratio:9/16;background:#000;border-radius:18px;border:1px solid #333}
video,audio{width:100%;border-radius:14px;margin-top:10px}.progress{height:9px;background:#2a2e35;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#fff;width:0}
.status{white-space:pre-wrap;background:#111318;border:1px solid #30343c;border-radius:12px;padding:12px;min-height:46px;margin-top:10px}
.sticky{position:sticky;bottom:10px;z-index:15;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}.switchrow input{width:auto;transform:scale(1.3)}
.rangeLine{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center}.rangeLine input[type=range]{padding:0}.rangeLine output{text-align:center;background:#111318;border:1px solid #383c45;border-radius:10px;padding:9px}
@media(max-width:480px){.grid,.actions{grid-template-columns:1fr}.templateGrid{grid-template-columns:1fr 1fr}.thumbs{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>모바일 쇼츠 메이커 V5 · 템플릿형</h1></header>
<main>

<section class="card">
<h2>1. 템플릿 선택</h2>
<div class="templateGrid">
<button class="secondary active" data-template="general">기본 정보형</button>
<button class="secondary" data-template="top5">TOP5</button>
<button class="secondary" data-template="food">맛집</button>
<button class="secondary" data-template="travel">여행</button>
<button class="secondary" data-template="product">상품 소개</button>
<button class="secondary" data-template="horror">공포·미스터리</button>
</div>
<p class="muted">템플릿을 선택하면 자막·전환·CTA 기본값이 자동 적용됩니다.</p>
</section>

<section class="card">
<h2>2. 사진과 컷 설정</h2>
<span class="pill">1080×1920</span><span class="pill">9:16</span><span class="pill">API 없음</span>
<div class="actions"><button id="clearBtn" class="danger">초기화</button><button id="saveProject" class="secondary">프로젝트 저장</button></div>
<label>사진 1~10장</label><input id="images" type="file" accept="image/*" multiple>
<div id="thumbs" class="thumbs"></div>
<label>콘텐츠 제목</label><input id="product" placeholder="예: 후쿠오카 맛집 TOP5">
<label>핵심 내용</label><textarea id="features" placeholder="한 줄에 하나씩 입력"></textarea>
<button id="autoBtn" class="good">템플릿 대본 자동 생성</button>
</section>

<section class="card">
<h2>3. 업로드 정보</h2>
<label>전체 대본</label><textarea id="script">첫 장면 훅
핵심 내용 1
핵심 내용 2
핵심 내용 3
마지막 저장 유도</textarea>
<label>유튜브 제목</label><input id="title" value="오늘의 추천 쇼츠">
<label>설명</label><textarea id="description">영상 내용을 짧게 정리했습니다.</textarea>
<label>해시태그</label><input id="hashtags" value="#쇼츠 #추천 #정보">
<div class="actions"><button id="copyTitle" class="secondary">제목 복사</button><button id="copyMeta" class="secondary">설명+태그 복사</button></div>
</section>

<section class="card">
<h2>4. 영상 디자인</h2>
<div class="grid">
<div><label>전체 길이</label><select id="duration"><option value="15">15초</option><option value="20" selected>20초</option><option value="25">25초</option><option value="30">30초</option></select></div>
<div><label>줌</label><select id="zoom"><option value="dynamic">강하게</option><option value="normal" selected>보통</option><option value="calm">약하게</option></select></div>
<div><label>전환</label><select id="transition"><option value="fade" selected>페이드</option><option value="flash">플래시</option><option value="slide">슬라이드</option><option value="none">없음</option></select></div>
<div><label>자막</label><select id="captionStyle"><option value="bold" selected>굵은 흰색</option><option value="yellow">노란 강조형</option><option value="box">검정 박스형</option><option value="impact">임팩트형</option></select></div>
<div><label>자막 위치</label><select id="captionPos"><option value="top">위</option><option value="center">가운데</option><option value="bottom" selected>아래</option></select></div>
<div><label>화질</label><select id="quality"><option value="5000000">표준</option><option value="8000000" selected>고화질</option><option value="11000000">최고화질</option></select></div>
</div>
<div class="switchrow"><label for="introCard" style="margin:0">첫 제목 카드</label><input id="introCard" type="checkbox" checked></div>
<div class="switchrow"><label for="endCard" style="margin:0">마지막 CTA</label><input id="endCard" type="checkbox" checked></div>
<div class="switchrow"><label for="progressLine" style="margin:0">하단 진행바</label><input id="progressLine" type="checkbox" checked></div>
<div class="switchrow"><label for="rankBadge" style="margin:0">TOP 번호 배지</label><input id="rankBadge" type="checkbox"></div>
<label>CTA 문구</label><input id="ctaText" value="저장하고 다음 영상도 확인하세요">
<label>워터마크</label><input id="watermark" placeholder="@채널명">
<label>음악 또는 음성 파일</label><input id="audio" type="file" accept="audio/*">
<label>오디오 볼륨</label><div class="rangeLine"><input id="audioVolume" type="range" min="0" max="100" value="70"><output id="volumeOut">70%</output></div>
</section>

<section class="card">
<h2>5. 미리보기·썸네일</h2>
<div class="preview"><canvas id="canvas" width="1080" height="1920"></canvas></div>
<div class="actions" style="margin-top:10px"><button id="previewBtn" class="secondary">미리보기</button><button id="thumbnailBtn" class="secondary">썸네일 저장</button></div>
</section>

<section class="card sticky">
<button id="renderBtn" class="primary">V5 쇼츠 만들기</button>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="status" class="status muted">사진을 선택하세요.</div>
<video id="result" controls playsinline></video>
<div class="actions" id="afterActions" style="display:none;margin-top:10px">
<a id="download"><button class="primary">영상 저장</button></a>
<button id="shareBtn" class="good">영상 공유</button>
<button id="youtubeBtn" class="youtube">YouTube 열기</button>
<button id="copyAllBtn" class="secondary">제목·설명 복사</button>
</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d");
let items=[],audioURL=null,raf=null,playing=false,lastBlob=null,lastType="video/webm",currentTemplate="general";

const templateDefaults={
 general:{zoom:"normal",transition:"fade",captionStyle:"bold",captionPos:"bottom",cta:"저장하고 다음 영상도 확인하세요",rank:false},
 top5:{zoom:"dynamic",transition:"slide",captionStyle:"impact",captionPos:"bottom",cta:"여러분의 1위는 어디인가요?",rank:true},
 food:{zoom:"dynamic",transition:"fade",captionStyle:"yellow",captionPos:"bottom",cta:"다음 여행을 위해 저장하세요",rank:false},
 travel:{zoom:"calm",transition:"fade",captionStyle:"bold",captionPos:"bottom",cta:"여행 전에 저장하세요",rank:false},
 product:{zoom:"normal",transition:"flash",captionStyle:"box",captionPos:"bottom",cta:"제품 정보는 고정댓글에서 확인하세요",rank:false},
 horror:{zoom:"calm",transition:"fade",captionStyle:"box",captionPos:"center",cta:"다음 이야기도 확인하세요",rank:false}
};
document.querySelectorAll("[data-template]").forEach(b=>b.onclick=()=>{
 currentTemplate=b.dataset.template;
 document.querySelectorAll("[data-template]").forEach(x=>x.classList.toggle("active",x===b));
 const d=templateDefaults[currentTemplate];
 $("zoom").value=d.zoom;$("transition").value=d.transition;$("captionStyle").value=d.captionStyle;$("captionPos").value=d.captionPos;$("ctaText").value=d.cta;$("rankBadge").checked=d.rank;
 drawFrame(0,+$("duration").value)
});

function lines(v){return v.split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function fitCover(img,z=1,px=0,py=0,slideX=0){const s=Math.max(1080/img.width,1920/img.height)*z,w=img.width*s,h=img.height*s;ctx.drawImage(img,(1080-w)/2+px*Math.max(0,w-1080)/2+slideX,(1920-h)/2+py*Math.max(0,h-1920)/2,w,h)}
function wrapText(text,max=900,size=60){ctx.font=`800 ${size}px sans-serif`;const out=[];let line="";for(const ch of [...text]){const test=line+ch;if(line&&ctx.measureText(test).width>max){out.push(line);line=ch}else line=test}if(line)out.push(line);return out.slice(0,3)}
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function drawCaption(text,progress=1){
 const style=$("captionStyle").value,size=style==="impact"?68:60,ls=wrapText(text,900,size),lh=size*1.35,total=ls.length*lh,pos=$("captionPos").value;
 let y=pos==="top"?250:pos==="center"?(1920-total)/2:1920-330-total;
 const p=Math.min(1,progress/.18),scale=style==="impact"?(.7+.3*easeOutBack(p)):1,alpha=Math.min(1,p*2);
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(540,y+total/2);ctx.scale(scale,scale);ctx.translate(-540,-(y+total/2));
 ctx.font=`900 ${size}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="top";
 for(const l of ls){
  if(style==="box"){const w=ctx.measureText(l).width+50;ctx.fillStyle="rgba(0,0,0,.78)";ctx.fillRect(540-w/2,y-8,w,size+20)}
  ctx.lineWidth=15;ctx.strokeStyle="rgba(0,0,0,.92)";ctx.strokeText(l,540,y);
  ctx.fillStyle=style==="yellow"||style==="impact"?"#ffe600":"#fff";ctx.fillText(l,540,y);y+=lh
 }ctx.restore()
}
function drawTitleCard(text,alpha=1){ctx.fillStyle="#0b0b0d";ctx.fillRect(0,0,1080,1920);const g=ctx.createRadialGradient(540,850,100,540,850,700);g.addColorStop(0,"rgba(255,255,255,.14)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);ctx.globalAlpha=alpha;ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 78px sans-serif";const ls=wrapText(text,850,78),lh=110;let y=900-(ls.length-1)*lh/2;for(const l of ls){ctx.fillText(l,540,y);y+=lh}ctx.globalAlpha=1}
function drawEndCard(text){ctx.fillStyle="rgba(0,0,0,.84)";ctx.fillRect(0,0,1080,1920);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 72px sans-serif";const ls=wrapText(text,850,72),lh=100;let y=930-(ls.length-1)*lh/2;for(const l of ls){ctx.fillText(l,540,y);y+=lh}ctx.font="700 38px sans-serif";ctx.fillStyle="rgba(255,255,255,.72)";ctx.fillText("Shorts",540,1260)}
function drawRank(rank){if(!$("rankBadge").checked)return;ctx.save();ctx.fillStyle="#ffe600";ctx.beginPath();ctx.arc(125,180,72,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.font="900 54px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(rank,125,180);ctx.restore()}
function drawProgress(t,d){if(!$("progressLine").checked)return;const p=Math.min(1,t/d);ctx.fillStyle="rgba(255,255,255,.2)";ctx.fillRect(70,1830,940,16);ctx.fillStyle="#fff";ctx.fillRect(70,1830,940*p,16)}
function visualDurations(totalVisual){
 const custom=items.map(x=>Number(x.seconds)||0),sum=custom.reduce((a,b)=>a+b,0);
 return sum>0?custom.map(x=>x/sum*totalVisual):items.map(()=>totalVisual/items.length)
}
function getIndexAtTime(vt,totalVisual){
 const ds=visualDurations(totalVisual);let acc=0;
 for(let i=0;i<ds.length;i++){if(vt<acc+ds[i]||i===ds.length-1)return {idx:i,local:(vt-acc)/ds[i]};acc+=ds[i]}
 return {idx:0,local:0}
}
function drawFrame(t,d){
 ctx.globalAlpha=1;ctx.fillStyle="#000";ctx.fillRect(0,0,1080,1920);
 if(!items.length){ctx.fillStyle="#fff";ctx.font="700 58px sans-serif";ctx.textAlign="center";ctx.fillText("사진을 선택하세요",540,960);return}
 const introSec=$("introCard").checked?1:0,endSec=$("endCard").checked?Math.min(2.5,d*.15):0,visual=d-introSec-endSec;
 if(introSec&&t<introSec){drawTitleCard($("title").value||$("product").value,Math.min(1,t/.25));drawProgress(t,d);return}
 if(endSec&&t>=introSec+visual){drawEndCard($("ctaText").value||"다음 영상도 확인하세요");drawProgress(t,d);return}
 const vt=Math.max(0,t-introSec),state=getIndexAtTime(vt,visual),idx=state.idx,local=state.local,it=items[idx],zoom=$("zoom").value;
 let z=1.03,px=0,py=0;if(zoom==="dynamic"){z=1.05+local*.18;px=(idx%2?1:-1)*(local-.5)*.22}else if(zoom==="calm"){z=1.02+local*.05;py=(local-.5)*.06}else{z=1.04+local*.10;px=(idx%2?1:-1)*(local-.5)*.1}
 const trans=$("transition").value;let slide=0;if(trans==="slide"&&local<.12)slide=(1-local/.12)*(idx%2?1080:-1080);
 fitCover(it.img,z,px,py,slide);
 const edge=Math.min(local,1-local);
 if(trans==="fade"&&edge<.12){ctx.fillStyle=`rgba(0,0,0,${(1-edge/.12)*.42})`;ctx.fillRect(0,0,1080,1920)}
 if(trans==="flash"&&local<.06){ctx.fillStyle=`rgba(255,255,255,${(1-local/.06)*.45})`;ctx.fillRect(0,0,1080,1920)}
 const g=ctx.createLinearGradient(0,1100,0,1920);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.64)");ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);
 const fallback=lines($("script").value),cap=(it.caption&&it.caption.trim())||fallback[Math.min(fallback.length-1,idx)]||$("product").value;
 drawCaption(cap,local);drawRank(currentTemplate==="top5"?`${items.length-idx}위`:`${idx+1}`);drawProgress(t,d);
 const w=$("watermark").value.trim();if(w){ctx.font="700 34px sans-serif";ctx.textAlign="right";ctx.textBaseline="bottom";ctx.fillStyle="rgba(255,255,255,.9)";ctx.fillText(w,1030,1780)}
}
function renderThumbs(){
 $("thumbs").innerHTML="";
 items.forEach((it,i)=>{const box=document.createElement("div");box.className="thumb";box.innerHTML=`<img src="${it.url}"><textarea placeholder="이 컷 자막">${it.caption||""}</textarea><div class="mini"><input type="number" min="1" max="10" step="0.5" value="${it.seconds||""}" placeholder="자동"><span class="muted" style="align-self:center">초</span></div><div class="tools"><button>←</button><button>×</button><button>→</button></div>`;
  box.querySelector("textarea").oninput=e=>it.caption=e.target.value;box.querySelector("input").oninput=e=>it.seconds=e.target.value;
  const [left,del,right]=box.querySelectorAll("button");left.onclick=()=>{if(i>0){[items[i-1],items[i]]=[items[i],items[i-1]];renderThumbs()}};del.onclick=()=>{items.splice(i,1);renderThumbs()};right.onclick=()=>{if(i<items.length-1){[items[i+1],items[i]]=[items[i],items[i+1]];renderThumbs()}};$("thumbs").appendChild(box)
 });drawFrame(0,+$("duration").value)
}
$("images").onchange=async e=>{const arr=[];for(const f of [...e.target.files].slice(0,10)){const url=URL.createObjectURL(f),img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});arr.push({url,img,file:f,caption:"",seconds:""})}items=arr;renderThumbs()};
$("clearBtn").onclick=()=>{items=[];renderThumbs()};
$("audio").onchange=e=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=e.target.files[0]?URL.createObjectURL(e.target.files[0]):null};
$("audioVolume").oninput=e=>$("volumeOut").value=e.target.value+"%";
$("autoBtn").onclick=()=>{
 const p=$("product").value.trim()||"이 콘텐츠",fs=lines($("features").value);
 let script,title,desc,tags;
 if(currentTemplate==="top5"){const vals=fs.length?fs:["5위 항목","4위 항목","3위 항목","2위 항목","1위 항목"];script=[`${p}, 지금부터 시작합니다`,...vals.slice(0,5),`여러분의 1위는 무엇인가요?`];title=`${p} TOP5`;desc=`${p}를 순위로 정리했습니다.`;tags=`#TOP5 #${p.replace(/\s/g,"")} #쇼츠 #추천`}
 else if(currentTemplate==="food"){script=[`${p}, 이곳은 저장하세요`,...(fs.length?fs:["대표 메뉴","분위기","가격대","추천 포인트"]),`다음 여행을 위해 저장하세요`];title=`${p} 꼭 가봐야 하는 이유`;desc=`${p}의 핵심 포인트를 정리했습니다.`;tags=`#맛집 #여행 #${p.replace(/\s/g,"")} #쇼츠`}
 else if(currentTemplate==="travel"){script=[`${p}, 가기 전에 이것만 보세요`,...(fs.length?fs:["볼거리","이동 팁","추천 시간","주의점"]),`여행 전에 저장하세요`];title=`${p} 여행 전 필수 정보`;desc=`${p} 여행 정보를 짧게 정리했습니다.`;tags=`#여행 #${p.replace(/\s/g,"")} #여행팁 #쇼츠`}
 else if(currentTemplate==="product"){script=[`이거 어디에 쓰는 걸까요?`,`${p}, 핵심만 정리합니다`,...(fs.length?fs:["간편하게 사용 가능","보관이 편리","활용도가 높음"]),`제품 정보는 고정댓글에서 확인하세요`];title=`생각보다 활용도 높은 ${p}`;desc=`${p}의 특징을 정리했습니다.\n\n※ 본 콘텐츠에는 제휴 링크가 포함될 수 있으며, 구매 시 일정 수수료를 받을 수 있습니다.`;tags=`#${p.replace(/\s/g,"")} #제품추천 #쿠팡파트너스 #쇼츠`}
 else if(currentTemplate==="horror"){script=[`이 이야기를 알고 있나요?`,`${p}`,...(fs.length?fs:["이상한 첫 번째 단서","두 번째 단서","마지막 목격담"]),`여러분은 어떻게 생각하나요?`];title=`아직도 풀리지 않은 ${p}`;desc=`${p} 이야기를 짧게 정리했습니다.`;tags=`#공포 #미스터리 #괴담 #쇼츠`}
 else {script=[`이거 알고 있었나요?`,`${p}, 핵심만 정리합니다`,...(fs.length?fs:["핵심 포인트 1","핵심 포인트 2","핵심 포인트 3"]),`저장하고 다음 영상도 확인하세요`];title=`20초로 보는 ${p}`;desc=`${p}의 핵심을 짧게 정리했습니다.`;tags=`#${p.replace(/\s/g,"")} #쇼츠 #추천 #정보`}
 $("script").value=script.join("\n");$("title").value=title;$("description").value=desc;$("hashtags").value=tags;items.forEach((it,i)=>it.caption=script[i]||"");renderThumbs()
};
$("copyTitle").onclick=async()=>{await navigator.clipboard.writeText($("title").value);alert("제목 복사 완료")};
$("copyMeta").onclick=async()=>{await navigator.clipboard.writeText($("description").value+"\n\n"+$("hashtags").value);alert("설명과 태그 복사 완료")};
$("copyAllBtn").onclick=async()=>{await navigator.clipboard.writeText($("title").value+"\n\n"+$("description").value+"\n\n"+$("hashtags").value);alert("제목·설명·태그 복사 완료")};
$("previewBtn").onclick=()=>{if(!items.length)return alert("사진을 먼저 선택하세요.");playing=false;if(raf)cancelAnimationFrame(raf);playing=true;const d=+$("duration").value,s=performance.now();const tick=n=>{if(!playing)return;const t=(n-s)/1000;drawFrame(Math.min(t,d-.001),d);if(t<d)raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)};
$("thumbnailBtn").onclick=()=>{if(!items.length)return alert("사진을 먼저 선택하세요.");drawFrame($("introCard").checked?0:0,+$("duration").value);canvas.toBlob(blob=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shorts_thumbnail.png";a.click();URL.revokeObjectURL(a.href)},"image/png")};
["duration","zoom","transition","captionStyle","captionPos","watermark","script","ctaText","endCard","introCard","progressLine","rankBadge","title"].forEach(id=>$(id).addEventListener("input",()=>drawFrame(0,+$("duration").value)));
function bestMime(){return ["video/mp4;codecs=h264,aac","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||""}
$("renderBtn").onclick=async()=>{
 if(!items.length)return alert("사진을 먼저 선택하세요.");
 if(!window.MediaRecorder||!canvas.captureStream){$("status").textContent="현재 브라우저에서 영상 저장을 지원하지 않습니다. 안드로이드 Chrome 또는 PC Chrome에서 열어주세요.";return}
 $("bar").style.width="0%";$("status").textContent="V5 영상 생성 중… 화면을 끄지 마세요.";$("afterActions").style.display="none";
 const d=+$("duration").value,stream=canvas.captureStream(30);let audio=null,aCtx=null;
 if(audioURL){audio=new Audio(audioURL);aCtx=new (window.AudioContext||window.webkitAudioContext)();const src=aCtx.createMediaElementSource(audio),gain=aCtx.createGain(),dest=aCtx.createMediaStreamDestination();gain.gain.value=+$("audioVolume").value/100;src.connect(gain);gain.connect(dest);gain.connect(aCtx.destination);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}
 const mime=bestMime();let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:+$("quality").value}:undefined)}catch(e){rec=new MediaRecorder(stream)}
 const chunks=[];rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};const done=new Promise(r=>rec.onstop=r);rec.start(1000);
 if(audio){await aCtx.resume();audio.currentTime=0;audio.play().catch(()=>{})}
 const start=performance.now();await new Promise(resolve=>{function tick(now){const t=(now-start)/1000;drawFrame(Math.min(t,d-.001),d);$("bar").style.width=`${Math.min(100,t/d*100)}%`;if(t<d)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)});
 rec.stop();if(audio)audio.pause();await done;lastType=rec.mimeType||mime||"video/webm";lastBlob=new Blob(chunks,{type:lastType});const url=URL.createObjectURL(lastBlob);
 $("result").src=url;$("download").href=url;$("download").download=lastType.includes("mp4")?"shorts_v5_1080x1920.mp4":"shorts_v5_1080x1920.webm";$("afterActions").style.display="grid";$("bar").style.width="100%";$("status").textContent=`완성 ${(lastBlob.size/1024/1024).toFixed(1)}MB\nV5 · 1080×1920`;if(aCtx)aCtx.close()
};
$("shareBtn").onclick=async()=>{if(!lastBlob)return alert("먼저 영상을 만드세요.");const ext=lastType.includes("mp4")?"mp4":"webm",file=new File([lastBlob],`shorts_v5.${ext}`,{type:lastType});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:$("title").value,text:$("description").value+"\n\n"+$("hashtags").value})}catch(e){}}else alert("영상 저장 후 YouTube 앱에서 업로드하세요.")};
$("youtubeBtn").onclick=async()=>{await navigator.clipboard.writeText($("title").value+"\n\n"+$("description").value+"\n\n"+$("hashtags").value);window.open("https://www.youtube.com/upload","_blank")};
$("saveProject").onclick=()=>{const d={template:currentTemplate,product:$("product").value,features:$("features").value,script:$("script").value,title:$("title").value,description:$("description").value,hashtags:$("hashtags").value,duration:$("duration").value,zoom:$("zoom").value,transition:$("transition").value,captionStyle:$("captionStyle").value,captionPos:$("captionPos").value,quality:$("quality").value,watermark:$("watermark").value,endCard:$("endCard").checked,introCard:$("introCard").checked,progressLine:$("progressLine").checked,rankBadge:$("rankBadge").checked,ctaText:$("ctaText").value,audioVolume:$("audioVolume").value};localStorage.setItem("mobileShortsV5",JSON.stringify(d));alert("저장했습니다. 사진은 다시 선택해야 합니다.")};
const saved=localStorage.getItem("mobileShortsV5");if(saved){try{const d=JSON.parse(saved);currentTemplate=d.template||"general";document.querySelectorAll("[data-template]").forEach(x=>x.classList.toggle("active",x.dataset.template===currentTemplate));Object.entries(d).forEach(([k,v])=>{if($(k)){if($(k).type==="checkbox")$(k).checked=v;else $(k).value=v}});$("volumeOut").value=$("audioVolume").value+"%"}catch(e){}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
drawFrame(0,20);
