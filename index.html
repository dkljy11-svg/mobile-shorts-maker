<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1012">
<link rel="manifest" href="manifest.webmanifest">
<title>모바일 쇼츠 메이커 V8</title>
<style>
:root{--bg:#0f1012;--card:#191b1f;--line:#30343c;--text:#fff;--muted:#adb3bd;--green:#bdf5cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:20;padding:14px 16px;background:rgba(15,16,18,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0}h2{font-size:17px;margin:0 0 12px}
main{max-width:820px;margin:auto;padding:14px 12px 130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:760;margin:11px 0 7px}
input,textarea,select,button{width:100%;font:inherit}
input,textarea,select{background:#111318;color:#fff;border:1px solid #383c45;border-radius:12px;padding:12px}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:14px;padding:13px;font-weight:850;cursor:pointer}
.primary{background:#fff;color:#111}.secondary{background:#2a2d34;color:#fff}.good{background:#193125;color:var(--green)}.danger{background:#3a2328;color:#ffc1ca}.youtube{background:#ff0033;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}.pill{display:inline-block;border:1px solid #3a3f48;border-radius:999px;padding:5px 9px;font-size:12px;color:#d2d5dc;margin:0 5px 5px 0}
.templateGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.templateGrid button.active{outline:2px solid #fff}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.thumb{position:relative;border-radius:14px;overflow:hidden;background:#111;border:1px solid #2d3138;padding-bottom:8px}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover}.thumb textarea{min-height:64px;margin:6px;width:calc(100% - 12px);font-size:12px}.thumb .mini{display:grid;grid-template-columns:1fr 90px;gap:6px;padding:0 6px 6px}.thumb .tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:0 6px}
.thumb button{padding:8px 0;border-radius:8px;background:#25282e;color:#fff}
.preview{display:flex;justify-content:center}canvas{width:min(100%,350px);aspect-ratio:9/16;background:#000;border-radius:18px;border:1px solid #333}
video,audio{width:100%;border-radius:14px;margin-top:10px}.progress{height:9px;background:#2a2e35;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#fff;width:0}
.status{white-space:pre-wrap;background:#111318;border:1px solid #30343c;border-radius:12px;padding:12px;min-height:46px;margin-top:10px}
.sticky{position:sticky;bottom:10px;z-index:15;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}.switchrow input{width:auto;transform:scale(1.3)}
.rangeLine{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center}.rangeLine input[type=range]{padding:0}.rangeLine output{text-align:center;background:#111318;border:1px solid #383c45;border-radius:10px;padding:9px}
.sourceButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keywordChips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.keywordChips button{width:auto;padding:8px 11px;border-radius:999px;background:#25282e;color:#fff;font-size:12px}
.notice{border-left:4px solid #ffe600;background:#111318;border-radius:10px;padding:11px 12px;margin-top:10px}
@media(max-width:480px){.grid,.actions{grid-template-columns:1fr}.templateGrid{grid-template-columns:1fr 1fr}.sourceButtons{grid-template-columns:1fr 1fr}.thumbs{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>모바일 쇼츠 메이커 V8 · 소스 검색형</h1></header>
<main>

<section class="card">
<h2>1. 템플릿</h2>
<div class="templateGrid">
<button class="secondary active" data-template="foodTop5">맛집 TOP5</button>
<button class="secondary" data-template="travelTop5">여행 TOP5</button>
<button class="secondary" data-template="shopping">쇼핑 추천</button>
<button class="secondary" data-template="review">추천·비추천</button>
<button class="secondary" data-template="horror">공포</button>
<button class="secondary" data-template="ranking">랭킹</button>
</div>
</section>

<section class="card">
<h2>2. 무료 소스 찾기</h2>
<p class="muted">주제를 입력하면 한국어·영어·일본어 검색어를 만듭니다. 버튼을 누르면 새 탭에서 검색 결과가 열립니다.</p>
<label>찾을 주제</label>
<input id="sourceTopic" value="후쿠오카 맛집 TOP5" placeholder="예: 후쿠오카 맛집 TOP5">
<button id="keywordBtn" class="good">검색 키워드 만들기</button>
<div class="grid">
<div><label>영어 검색어</label><input id="keywordEn" value="Fukuoka food ramen yatai"></div>
<div><label>일본어 검색어</label><input id="keywordJa" value="福岡 グルメ ラーメン 屋台"></div>
</div>
<div id="keywordChips" class="keywordChips"></div>
<label>무료 사진 검색</label>
<div class="sourceButtons">
<button class="secondary sourceLink" data-site="pexelsPhoto">Pexels 사진</button>
<button class="secondary sourceLink" data-site="pixabayPhoto">Pixabay 사진</button>
<button class="secondary sourceLink" data-site="unsplash">Unsplash</button>
</div>
<label>무료 영상 검색</label>
<div class="sourceButtons">
<button class="secondary sourceLink" data-site="pexelsVideo">Pexels 영상</button>
<button class="secondary sourceLink" data-site="pixabayVideo">Pixabay 영상</button>
<button class="secondary sourceLink" data-site="mixkit">Mixkit 영상</button>
</div>
<label>참고 자료 검색</label>
<div class="sourceButtons">
<button class="secondary sourceLink" data-site="googleImages">Google 이미지</button>
<button class="secondary sourceLink" data-site="youtube">YouTube 참고</button>
<button class="secondary sourceLink" data-site="googleWeb">Google 검색</button>
</div>
<div class="notice muted"><strong>저작권 확인:</strong> 검색 결과가 모두 자유 이용 가능한 것은 아닙니다. 각 사이트의 라이선스와 상업적 이용 가능 여부를 확인하고, 유튜브 영상은 참고용으로만 사용하세요.</div>
</section>

<section class="card">
<h2>3. 사진과 컷 구성</h2>
<span class="pill">1080×1920</span><span class="pill">30fps</span><span class="pill">API 없음</span>
<div class="actions"><button id="clearBtn" class="danger">초기화</button><button id="saveProject" class="secondary">프로젝트 저장</button></div>
<label>사진 1~10장</label><input id="images" type="file" accept="image/*" multiple>
<div id="thumbs" class="thumbs"></div>
<label>쇼츠 제목</label><input id="product" value="후쿠오카 가면 꼭 먹어야 하는 맛집 TOP5">
<label>핵심 내용</label><textarea id="features">하카타 라멘
모츠나베
멘타이주
야타이
스시</textarea>
<button id="autoBtn" class="good">V8 대본 자동 구성</button>
</section>

<section class="card">
<h2>4. 업로드 정보</h2>
<label>전체 대본</label><textarea id="script">후쿠오카 맛집 TOP5
5위 하카타 라멘
4위 모츠나베
3위 멘타이주
2위 야타이
1위 스시
여러분의 1위는 어디인가요?</textarea>
<label>유튜브 제목</label><input id="title" value="후쿠오카 맛집 TOP5">
<label>설명</label><textarea id="description">후쿠오카에서 꼭 먹어볼 맛집을 순위로 정리했습니다.</textarea>
<label>해시태그</label><input id="hashtags" value="#후쿠오카 #후쿠오카맛집 #일본여행 #TOP5 #쇼츠">
<div class="actions"><button id="copyTitle" class="secondary">제목 복사</button><button id="copyMeta" class="secondary">설명+태그 복사</button></div>
</section>

<section class="card">
<h2>5. 영상 디자인</h2>
<div class="grid">
<div><label>길이</label><select id="duration"><option value="15">15초</option><option value="20" selected>20초</option><option value="30">30초</option><option value="45">45초</option></select></div>
<div><label>컷 효과</label><select id="motionMode"><option value="auto" selected>자동 랜덤</option><option value="zoomIn">줌인</option><option value="zoomOut">줌아웃</option><option value="pan">좌우 이동</option></select></div>
<div><label>전환</label><select id="transition"><option value="fade" selected>페이드</option><option value="flash">플래시</option><option value="slide">슬라이드</option><option value="none">없음</option></select></div>
<div><label>자막 애니메이션</label><select id="captionAnim"><option value="pop" selected>팝업</option><option value="typing">타이핑</option><option value="fade">페이드</option><option value="slide">슬라이드</option></select></div>
<div><label>자막 스타일</label><select id="captionStyle"><option value="impact" selected>임팩트형</option><option value="yellow">노란 강조형</option><option value="bold">굵은 흰색</option><option value="box">검정 박스형</option></select></div>
<div><label>테마색</label><select id="themeColor"><option value="#ffe600" selected>노랑</option><option value="#40e0d0">민트</option><option value="#ff5c8a">핑크</option><option value="#7aa7ff">파랑</option><option value="#ffffff">흰색</option></select></div>
<div><label>자막 위치</label><select id="captionPos"><option value="top">위</option><option value="center">가운데</option><option value="bottom" selected>아래</option></select></div>
<div><label>화질</label><select id="quality"><option value="5000000">표준</option><option value="8000000" selected>고화질</option><option value="11000000">최고화질</option></select></div>
</div>
<div class="switchrow"><label for="introCard" style="margin:0">첫 제목 카드</label><input id="introCard" type="checkbox" checked></div>
<div class="switchrow"><label for="endCard" style="margin:0">마지막 CTA</label><input id="endCard" type="checkbox" checked></div>
<div class="switchrow"><label for="stepDots" style="margin:0">단계 표시</label><input id="stepDots" type="checkbox" checked></div>
<div class="switchrow"><label for="medalBadge" style="margin:0">메달·순위 배지</label><input id="medalBadge" type="checkbox" checked></div>
<div class="switchrow"><label for="pulseOverlay" style="margin:0">비트 펄스 효과</label><input id="pulseOverlay" type="checkbox" checked></div>
<label>CTA 문구</label><input id="ctaText" value="여러분의 1위는 어디인가요? 댓글로 알려주세요">
<label>워터마크</label><input id="watermark" placeholder="@채널명">
<label>음악 또는 음성 파일</label><input id="audio" type="file" accept="audio/*">
<label>오디오 볼륨</label><div class="rangeLine"><input id="audioVolume" type="range" min="0" max="100" value="70"><output id="volumeOut">70%</output></div>
</section>

<section class="card">
<h2>6. 미리보기·썸네일</h2>
<div class="preview"><canvas id="canvas" width="1080" height="1920"></canvas></div>
<div class="actions" style="margin-top:10px"><button id="previewBtn" class="secondary">미리보기</button><button id="thumbnailBtn" class="secondary">썸네일 저장</button></div>
</section>

<section class="card sticky">
<button id="renderBtn" class="primary">V8 쇼츠 만들기</button>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="status" class="status muted">사진을 선택하세요.</div>
<video id="result" controls playsinline></video>
<div class="actions" id="afterActions" style="display:none;margin-top:10px">
<a id="download"><button class="primary">영상 저장</button></a>
<button id="shareBtn" class="good">영상 공유</button>
<button id="youtubeBtn" class="youtube">YouTube 열기</button>
<button id="copyAllBtn" class="secondary">제목·설명 복사</button>
</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d");
let items=[],audioURL=null,raf=null,playing=false,lastBlob=null,lastType="video/webm",currentTemplate="foodTop5";

function lines(v){return v.split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function wrapText(text,max=900,size=60){ctx.font=`800 ${size}px sans-serif`;const out=[];let line="";for(const ch of [...text]){const test=line+ch;if(line&&ctx.measureText(test).width>max){out.push(line);line=ch}else line=test}if(line)out.push(line);return out.slice(0,3)}
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function motionFor(idx){const mode=$("motionMode").value;if(mode!=="auto")return mode;return ["zoomIn","pan","zoomOut","pan"][idx%4]}
function fitCover(img,local,idx,slideX=0){const mode=motionFor(idx);let z=1.04,px=0;if(mode==="zoomIn")z=1.03+local*.16;if(mode==="zoomOut")z=1.20-local*.14;if(mode==="pan"){z=1.09;px=(idx%2?1:-1)*(local-.5)*.32}const s=Math.max(1080/img.width,1920/img.height)*z,w=img.width*s,h=img.height*s;ctx.drawImage(img,(1080-w)/2+px*Math.max(0,w-1080)/2+slideX,(1920-h)/2,w,h)}
function animatedText(text,local){
 const anim=$("captionAnim").value;
 if(anim==="typing"){const n=Math.max(1,Math.floor(text.length*Math.min(1,local/.55)));return text.slice(0,n)}
 return text
}
function drawCaption(text,local=1){
 text=animatedText(text,local);
 const style=$("captionStyle").value,size=style==="impact"?70:60,ls=wrapText(text,900,size),lh=size*1.35,total=ls.length*lh,pos=$("captionPos").value;
 let y=pos==="top"?270:pos==="center"?(1920-total)/2:1920-340-total;
 const anim=$("captionAnim").value,p=Math.min(1,local/.18);
 let scale=1,alpha=1,offset=0;
 if(anim==="pop")scale=.68+.32*easeOutBack(p);
 if(anim==="fade")alpha=Math.min(1,p*2);
 if(anim==="slide")offset=(1-p)*160;
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(540,y+total/2+offset);ctx.scale(scale,scale);ctx.translate(-540,-(y+total/2));
 ctx.font=`900 ${size}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="top";
 for(const l of ls){if(style==="box"){const w=ctx.measureText(l).width+50;ctx.fillStyle="rgba(0,0,0,.82)";ctx.fillRect(540-w/2,y-8,w,size+20)}ctx.lineWidth=15;ctx.strokeStyle="rgba(0,0,0,.95)";ctx.strokeText(l,540,y);ctx.fillStyle=(style==="yellow"||style==="impact")?$("themeColor").value:"#fff";ctx.fillText(l,540,y);y+=lh}ctx.restore()
}
function drawTitleCard(text,alpha=1){
 const color=$("themeColor").value;ctx.fillStyle="#09090b";ctx.fillRect(0,0,1080,1920);
 const g=ctx.createRadialGradient(540,820,100,540,820,760);g.addColorStop(0,color+"44");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);
 ctx.globalAlpha=alpha;ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 80px sans-serif";const ls=wrapText(text,840,80),lh=112;let y=900-(ls.length-1)*lh/2;for(const l of ls){ctx.fillText(l,540,y);y+=lh}
 ctx.font="800 40px sans-serif";ctx.fillStyle=color;ctx.fillText("지금부터 시작합니다",540,1230);ctx.globalAlpha=1
}
function drawEndCard(text){const color=$("themeColor").value;ctx.fillStyle="rgba(0,0,0,.90)";ctx.fillRect(0,0,1080,1920);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 70px sans-serif";const ls=wrapText(text,850,70),lh=98;let y=900-(ls.length-1)*lh/2;for(const l of ls){ctx.fillText(l,540,y);y+=lh}ctx.font="700 38px sans-serif";ctx.fillStyle=color;ctx.fillText("좋아요 · 저장 · 댓글",540,1280)}
function drawMedal(idx){if(!$("medalBadge").checked)return;const rank=items.length-idx;let fill=$("themeColor").value,txt=`${rank}위`;if(rank===1)txt="🥇 1위";else if(rank===2)txt="🥈 2위";else if(rank===3)txt="🥉 3위";ctx.save();ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(60,90,270,100,28);ctx.fill();ctx.fillStyle="#111";ctx.font="900 48px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,195,140);ctx.restore()}
function drawDots(idx){if(!$("stepDots").checked)return;const total=items.length,gap=52,start=540-(total-1)*gap/2;for(let i=0;i<total;i++){ctx.beginPath();ctx.arc(start+i*gap,1810,13,0,Math.PI*2);ctx.fillStyle=i===idx?"#fff":"rgba(255,255,255,.28)";ctx.fill()}}
function drawPulse(t){if(!$("pulseOverlay").checked)return;const beat=(Math.sin(t*Math.PI*4)+1)/2;ctx.fillStyle=`rgba(255,255,255,${beat*.035})`;ctx.fillRect(0,0,1080,1920)}
function visualDurations(totalVisual){const custom=items.map(x=>Number(x.seconds)||0),sum=custom.reduce((a,b)=>a+b,0);return sum>0?custom.map(x=>x/sum*totalVisual):items.map(()=>totalVisual/items.length)}
function getIndexAtTime(vt,totalVisual){const ds=visualDurations(totalVisual);let acc=0;for(let i=0;i<ds.length;i++){if(vt<acc+ds[i]||i===ds.length-1)return {idx:i,local:(vt-acc)/ds[i]};acc+=ds[i]}return {idx:0,local:0}}
function drawFrame(t,d){
 ctx.globalAlpha=1;ctx.fillStyle="#000";ctx.fillRect(0,0,1080,1920);
 if(!items.length){ctx.fillStyle="#fff";ctx.font="700 58px sans-serif";ctx.textAlign="center";ctx.fillText("사진을 선택하세요",540,960);return}
 const introSec=$("introCard").checked?1.2:0,endSec=$("endCard").checked?Math.min(3,d*.16):0,visual=d-introSec-endSec;
 if(introSec&&t<introSec){drawTitleCard($("title").value||$("product").value,Math.min(1,t/.28));drawPulse(t);return}
 if(endSec&&t>=introSec+visual){drawEndCard($("ctaText").value||"댓글로 알려주세요");drawPulse(t);return}
 const vt=Math.max(0,t-introSec),state=getIndexAtTime(vt,visual),idx=state.idx,local=state.local,it=items[idx];
 let slide=0;if($("transition").value==="slide"&&local<.13)slide=(1-local/.13)*(idx%2?1080:-1080);
 fitCover(it.img,local,idx,slide);
 const edge=Math.min(local,1-local),trans=$("transition").value;
 if(trans==="fade"&&edge<.12){ctx.fillStyle=`rgba(0,0,0,${(1-edge/.12)*.42})`;ctx.fillRect(0,0,1080,1920)}
 if(trans==="flash"&&local<.06){ctx.fillStyle=`rgba(255,255,255,${(1-local/.06)*.48})`;ctx.fillRect(0,0,1080,1920)}
 const g=ctx.createLinearGradient(0,1050,0,1920);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.70)");ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);
 const fallback=lines($("script").value),cap=(it.caption&&it.caption.trim())||fallback[Math.min(fallback.length-1,idx)]||$("product").value;
 drawCaption(cap,local);drawMedal(idx);drawDots(idx);drawPulse(t);
 const w=$("watermark").value.trim();if(w){ctx.font="700 34px sans-serif";ctx.textAlign="right";ctx.textBaseline="bottom";ctx.fillStyle="rgba(255,255,255,.9)";ctx.fillText(w,1030,1760)}
}
function renderThumbs(){
 $("thumbs").innerHTML="";
 items.forEach((it,i)=>{const box=document.createElement("div");box.className="thumb";box.innerHTML=`<img src="${it.url}"><textarea placeholder="이 컷 자막">${it.caption||""}</textarea><div class="mini"><input type="number" min="1" max="10" step="0.5" value="${it.seconds||""}" placeholder="자동"><span class="muted" style="align-self:center">초</span></div><div class="tools"><button>←</button><button>×</button><button>→</button></div>`;
 box.querySelector("textarea").oninput=e=>it.caption=e.target.value;box.querySelector("input").oninput=e=>it.seconds=e.target.value;
 const [left,del,right]=box.querySelectorAll("button");left.onclick=()=>{if(i>0){[items[i-1],items[i]]=[items[i],items[i-1]];renderThumbs()}};del.onclick=()=>{items.splice(i,1);renderThumbs()};right.onclick=()=>{if(i<items.length-1){[items[i+1],items[i]]=[items[i],items[i+1]];renderThumbs()}};$("thumbs").appendChild(box)

}

const sourceDictionary={
 "후쿠오카":["Fukuoka","福岡"],"도쿄":["Tokyo","東京"],"오사카":["Osaka","大阪"],"교토":["Kyoto","京都"],
 "부산":["Busan","釜山"],"서울":["Seoul","ソウル"],"제주":["Jeju","済州"],
 "맛집":["food restaurant ramen street food","グルメ レストラン ラーメン"],"여행":["travel attractions city","旅行 観光"],
 "라멘":["ramen noodles","ラーメン"],"초밥":["sushi","寿司"],"스시":["sushi","寿司"],"야타이":["yatai street food","屋台"],
 "편의점":["convenience store snacks","コンビニ"],"상품":["product lifestyle","商品"],"공포":["horror dark mystery","ホラー ミステリー"],
 "카페":["cafe coffee dessert","カフェ コーヒー"],"호텔":["hotel room travel","ホテル"],"바다":["ocean beach","海 ビーチ"]
};
function makeSourceKeywords(topic){
 let en=[],ja=[];
 Object.entries(sourceDictionary).forEach(([ko,pair])=>{if(topic.includes(ko)){en.push(pair[0]);ja.push(pair[1])}});
 const clean=topic.replace(/TOP\s*\d+/ig,"").replace(/[0-9]/g,"").trim();
 if(!en.length)en.push(clean); if(!ja.length)ja.push(clean);
 return {en:[...new Set(en)].join(" "),ja:[...new Set(ja)].join(" ")};
}
function renderKeywordChips(){
 const chips=[...$("keywordEn").value.split(/\s+/),...$("keywordJa").value.split(/\s+/)].filter(Boolean).slice(0,12);
 $("keywordChips").innerHTML="";
 chips.forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>navigator.clipboard.writeText(k);$("keywordChips").appendChild(b)})
}
$("keywordBtn").onclick=()=>{
 const topic=$("sourceTopic").value.trim()||$("product").value.trim();
 const k=makeSourceKeywords(topic);$("keywordEn").value=k.en;$("keywordJa").value=k.ja;renderKeywordChips()
};
["keywordEn","keywordJa"].forEach(id=>$(id).addEventListener("input",renderKeywordChips));
document.querySelectorAll(".sourceLink").forEach(b=>b.onclick=()=>{
 const en=$("keywordEn").value.trim()||$("sourceTopic").value.trim(),ja=$("keywordJa").value.trim(),q=encodeURIComponent(en),qJa=encodeURIComponent(ja||en);
 const urls={
  pexelsPhoto:`https://www.pexels.com/search/${q}/`,
  pixabayPhoto:`https://pixabay.com/images/search/${q}/`,
  unsplash:`https://unsplash.com/s/photos/${q}`,
  pexelsVideo:`https://www.pexels.com/search/videos/${q}/`,
  pixabayVideo:`https://pixabay.com/videos/search/${q}/`,
  mixkit:`https://mixkit.co/free-stock-video/?q=${q}`,
  googleImages:`https://www.google.com/search?tbm=isch&q=${qJa}`,
  youtube:`https://www.youtube.com/results?search_query=${qJa}`,
  googleWeb:`https://www.google.com/search?q=${qJa}`
 };
 window.open(urls[b.dataset.site],"_blank","noopener")
});
renderKeywordChips();

$("images").onchange=async e=>{const arr=[];for(const f of [...e.target.files].slice(0,10)){const url=URL.createObjectURL(f),img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});arr.push({url,img,file:f,caption:"",seconds:""})}items=arr;renderThumbs()};

$("autoBtn").onclick=()=>{

 if(currentTemplate.includes("Top5")||currentTemplate==="ranking"){const vals=fs.length?fs:["5위 항목","4위 항목","3위 항목","2위 항목","1위 항목"];script=[p,...vals.slice(0,5).map((x,i)=>`${5-i}위 ${x}`),$("ctaText").value];tags="#TOP5 #랭킹 #쇼츠"}
 else if(currentTemplate==="shopping"){script=["이거 어디에 쓰는 걸까요?",p,...(fs.length?fs:["사용이 간편함","보관이 편리함","활용도가 높음"]),"제품 정보는 고정댓글에서 확인하세요"];tags="#제품추천 #쇼핑 #쇼츠"}
 else if(currentTemplate==="review"){script=["이 제품 추천할까요?",p,...(fs.length?fs:["좋았던 점","아쉬운 점","추천 대상"]),$("ctaText").value];tags="#리뷰 #추천 #비추천 #쇼츠"}
 else if(currentTemplate==="horror"){script=["이 이야기를 알고 있나요?",p,...(fs.length?fs:["첫 번째 단서","두 번째 단서","마지막 목격담"]),$("ctaText").value];tags="#공포 #미스터리 #괴담 #쇼츠"}
 $("script").value=script.join("\n");$("title").value=p;$("description").value=`${p}의 핵심 내용을 짧게 정리했습니다.`;$("hashtags").value=tags;items.forEach((it,i)=>it.caption=script[i+1]||script[i]||"");renderThumbs()
};

$("previewBtn").onclick=()=>{if(!items.length)return alert("사진을 먼저 선택하세요.");playing=false;if(raf)cancelAnimationFrame(raf);playing=true;const d=+$("duration").value,s=performance.now();const tick=n=>{if(!playing)return;const t=(n-s)/1000;drawFrame(Math.min(t,d-.001),d);if(t<d)raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)};
$("thumbnailBtn").onclick=()=>{if(!items.length)return alert("사진을 먼저 선택하세요.");drawTitleCard($("title").value||$("product").value,1);canvas.toBlob(blob=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shorts_thumbnail_v8.png";a.click();URL.revokeObjectURL(a.href)},"image/png")};
["duration","motionMode","transition","captionAnim","captionStyle","themeColor","captionPos","watermark","script","ctaText","endCard","introCard","stepDots","medalBadge","pulseOverlay","title"].forEach(id=>$(id).addEventListener("input",()=>drawFrame(0,+$("duration").value)));
function bestMime(){return ["video/mp4;codecs=h264,aac","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||""}
$("renderBtn").onclick=async()=>{
 if(!items.length)return alert("사진을 먼저 선택하세요.");
 if(!window.MediaRecorder||!canvas.captureStream){$("status").textContent="현재 브라우저에서 영상 저장을 지원하지 않습니다. 안드로이드 Chrome 또는 PC Chrome에서 열어주세요.";return}
 $("bar").style.width="0%";$("status").textContent="V8 영상 생성 중… 화면을 끄지 마세요.";$("afterActions").style.display="none";
 const d=+$("duration").value,stream=canvas.captureStream(30);let audio=null,aCtx=null;
 if(audioURL){audio=new Audio(audioURL);aCtx=new (window.AudioContext||window.webkitAudioContext)();const src=aCtx.createMediaElementSource(audio),gain=aCtx.createGain(),dest=aCtx.createMediaStreamDestination();gain.gain.value=+$("audioVolume").value/100;src.connect(gain);gain.connect(dest);gain.connect(aCtx.destination);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}
 const mime=bestMime();let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:+$("quality").value}:undefined)}catch(e){rec=new MediaRecorder(stream)}
 const chunks=[];rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};const done=new Promise(r=>rec.onstop=r);rec.start(1000);
 if(audio){await aCtx.resume();audio.currentTime=0;audio.play().catch(()=>{})}
 const start=performance.now();await new Promise(resolve=>{function tick(now){const t=(now-start)/1000;drawFrame(Math.min(t,d-.001),d);$("bar").style.width=`${Math.min(100,t/d*100)}%`;if(t<d)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)});
 rec.stop();if(audio)audio.pause();await done;lastType=rec.mimeType||mime||"video/webm";lastBlob=new Blob(chunks,{type:lastType});const url=URL.createObjectURL(lastBlob);
 $("result").src=url;$("download").href=url;$("download").download=lastType.includes("mp4")?"shorts_v8_1080x1920.mp4":"shorts_v8_1080x1920.webm";$("afterActions").style.display="grid";$("bar").style.width="100%";$("status").textContent=`완성 ${(lastBlob.size/1024/1024).toFixed(1)}MB\nV8 · 1080×1920 · 30fps`;if(aCtx)aCtx.close()
};
$("shareBtn").onclick=async()=>{if(!lastBlob)return alert("먼저 영상을 만드세요.");const ext=lastType.includes("mp4")?"mp4":"webm",file=new File([lastBlob],`shorts_v8.${ext}`,{type:lastType});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:$("title").value,text:$("description").value+"\n\n"+$("hashtags").value})}catch(e){}}else alert("영상 저장 후 YouTube 앱에서 업로드하세요.")};
